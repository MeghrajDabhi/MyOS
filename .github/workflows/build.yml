name: Build MeghrajOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie
      options: --privileged --security-opt seccomp=unconfined

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Debian Live build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates

      - name: Show build environment
        run: |
          echo "Debian:"
          cat /etc/debian_version
          echo "live-build:"
          lb --version

      - name: Clean old configuration
        run: |
          rm -rf config
          rm -rf cache
          rm -rf chroot
          rm -rf binary
          rm -rf installer
          rm -rf tftpboot

      - name: Configure MeghrajOS
        run: |
          lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloaders "grub-pc grub-efi" \
            --linux-packages "linux-image" \
            --linux-flavours "amd64" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "https://deb.debian.org/debian/" \
            --mirror-chroot "https://deb.debian.org/debian/" \
            --mirror-binary "https://deb.debian.org/debian/" \
            --mirror-chroot-security "https://security.debian.org/debian-security/" \
            --mirror-binary-security "https://security.debian.org/debian-security/" \
            --debian-installer none \
            --initramfs live-boot \
            --initsystem systemd \
            --apt-secure true \
            --apt-recommends true \
            --image-name "MeghrajOS" \
            --iso-application "MeghrajOS" \
            --iso-volume "MEGHRAJOS"

      - name: Create package list
        run: |
          mkdir -p config/package-lists

          cat > config/package-lists/meghraj.list.chroot << 'EOF'
          bash
          sudo
          nano
          network-manager
          wpasupplicant
          bluez
          rfkill
          firmware-linux
          firefox-esr
          xserver-xorg
          xinit
          openbox
          xterm
          EOF

      - name: Set OS identity
        run: |
          mkdir -p config/includes.chroot/etc

          cat > config/includes.chroot/etc/os-release << 'EOF'
          PRETTY_NAME="MeghrajOS"
          NAME="MeghrajOS"
          ID=meghrajos
          ID_LIKE=debian
          VERSION="0.1"
          VERSION_ID="0.1"
          EOF

          echo "MeghrajOS" > config/includes.chroot/etc/hostname

      - name: Build ISO
        run: |
          lb build

      - name: Show generated files
        run: |
          echo "Generated files:"
          find . -maxdepth 2 -type f \
            \( -name "*.iso" -o -name "*.img" \) \
            -print

      - name: Upload ISO
        uses: actions/upload-artifact@v6
        with:
          name: MeghrajOS-ISO
          path: "*.iso"
          if-no-files-found: error
