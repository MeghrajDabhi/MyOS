name: Build MeghrajOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Prepare clean Live-build configuration
        run: |
          sudo rm -rf config
          sudo rm -rf .build
          sudo rm -rf chroot
          sudo rm -rf binary
          sudo rm -rf cache
          sudo rm -rf tftpboot

      - name: Configure MeghrajOS
        run: |
          lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloaders "grub-pc grub-efi" \
            --linux-packages "linux-image" \
            --linux-flavours amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "https://deb.debian.org/debian/" \
            --mirror-chroot "https://deb.debian.org/debian/" \
            --mirror-binary "https://deb.debian.org/debian/" \
            --mirror-chroot-security "https://security.debian.org/debian-security/" \
            --mirror-binary-security "https://security.debian.org/debian-security/" \
            --debian-installer none \
            --firmware-chroot true \
            --firmware-binary true \
            --initramfs live-boot \
            --initsystem systemd \
            --apt-secure true \
            --apt-recommends true \
            --image-name "MeghrajOS"

      - name: Create MeghrajOS package list
        run: |
          mkdir -p config/package-lists

          cat > config/package-lists/meghraj.list.chroot << 'EOF'
          bash
          sudo
          nano
          network-manager
          wpasupplicant
          bluez
          rfkill
          firefox-esr
          xserver-xorg
          xinit
          openbox
          xterm
          EOF

      - name: Create basic OS configuration
        run: |
          mkdir -p config/includes.chroot/etc

          echo "MeghrajOS" | sudo tee config/includes.chroot/etc/hostname

          cat > config/includes.chroot/etc/os-release << 'EOF'
          PRETTY_NAME="MeghrajOS"
          NAME="MeghrajOS"
          ID=meghrajos
          ID_LIKE=debian
          VERSION="0.1"
          VERSION_ID="0.1"
          HOME_URL="https://github.com/MeghrajDabhi/MyOS"
          EOF

      - name: Build ISO
        run: |
          sudo lb build

      - name: Find ISO
        run: |
          echo "Generated files:"
          find . -maxdepth 2 -type f \( -name "*.iso" -o -name "*.img" \) -print

      - name: Upload MeghrajOS ISO
        uses: actions/upload-artifact@v7
        with:
          name: MeghrajOS-ISO
          path: "*.iso"
          if-no-files-found: error
