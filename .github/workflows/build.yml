name: Build MeghrajOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Configure MeghrajOS
        run: |
          lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware"

          mkdir -p config/package-lists

          cat > config/package-lists/meghraj.list.chroot << 'EOF'
          linux-image-amd64
          systemd-sysv
          bash
          sudo
          nano
          network-manager
          bluez
          rfkill
          firefox-esr
          xserver-xorg
          xinit
          openbox
          xterm
          EOF

      - name: Build ISO
        run: |
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v6
        with:
          name: MeghrajOS
          path: "*.iso"
